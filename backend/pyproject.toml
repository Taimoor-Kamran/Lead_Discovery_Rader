[project]
name = "lead-discovery-radar"
version = "0.1.0"
description = "Lead Discovery Radar — internal lead-intelligence pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.3,<6.0",
    "redis>=5.2,<6.0",
    "rq>=2.0,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "email-validator>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.22,<1.0",
    "fakeredis>=2.26,<3.0",
    "testcontainers[postgres]>=4.9,<5.0",
    "types-beautifulsoup4>=4.12,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/core/security.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["^migrations/versions/"]
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["rq.*", "fakeredis.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a real PostgreSQL database"]
filterwarnings = ["ignore::DeprecationWarning"]
